aid: thriva
name: Thriva
description: >-
  Thriva is a UK digital-health company and the UK market leader in at-home consumer
  diagnostics, tracking 75+ blood biomarkers with doctor-reviewed insights. Alongside its
  direct-to-consumer service, the Thriva Platform offers partners a white-label at-home
  blood-testing infrastructure - kit logistics, lab processing, results and clinical
  escalations - through a RESTful JSON:API Platform API with OAuth2 client-credentials
  auth, Svix-signed webhooks and a full sandbox environment.
