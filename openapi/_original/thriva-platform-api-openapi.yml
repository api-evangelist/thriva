    Appointment:
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          description: The unique identifier for the Appointment
          type: string
          example: APT-A1B2C3D4-E5F6-47G8-H9I0-J1K2L3M4N5O6
        type:
          type: string
          enum:
          - appointment
        attributes:
          type: object
          properties:
            status:
              description: The current status of the Appointment
              type: string
              enum:
              - pending
              - appointment_created
              - scheduled
              - in_progress
              - completed
              - cancelled
              - failed
              example: pending
            provider_type:
              description: The appointment provider. A `remote` provider means a practitioner
                visits the patient at their home or office rather than at a clinic.
              type: string
              enum:
              - remote-appt-a
              example: remote-appt-a
            order_id:
              description: The reference of the associated Order
              type: string
              example: O-A7A2A7C5-1C49-4B76-B560-6CBA5C28368E
            user_id:
              description: The ID of the associated User
              type: string
              example: U-8719EAF0-6B39-46B5-86DA-AF11155F3B65
            address_id:
              description: The ID to the address used for the appointment
              type: string
              nullable: true
              example: AD-12345678-1234-1234-1234-123456789012
            metadata:
              description: Custom metadata attached to the appointment
              type: object
              nullable: true
              example:
                task_id: tsk_custom_123
            notes:
              description: Notes for the appointment
              type: string
              nullable: true
              example: Morning appointment preferred
            scheduling_url:
              description: URL for the patient to schedule their appointment
              type: string
              example: https://provider.example.com/schedule/abc123
            scheduled_at:
              description: The date and time the appointment is scheduled for
              type: string
              format: date-time
              nullable: true
              example: '2026-03-27T09:00:00Z'
            practitioner_name:
              description: The name of the assigned practitioner
              type: string
              nullable: true
              example: Dr Alice Green
            completed_at:
              description: The date and time the appointment was completed
              type: string
              format: date-time
              nullable: true
              example: null
            cancelled_at:
              description: The date and time the appointment was cancelled
              type: string
              format: date-time
              nullable: true
              example: null
            cancellation_reason:
              description: The reason for cancellation, if applicable
              type: string
              nullable: true
              example: null
            failed_at:
              description: The date and time the appointment failed
              type: string
              format: date-time
              nullable: true
              example: null
            failure_reason:
              description: The reason for failure, if applicable
              type: string
              nullable: true
              example: null
            last_synced_at:
              description: The date and time the appointment data was last synced
                with the provider
              type: string
              format: date-time
              nullable: true
              example: '2026-03-25T10:30:00Z'
            created_at:
              description: The date and time the Appointment was created
              type: string
              format: date-time
              example: '2026-03-25T10:30:00Z'
            updated_at:
              description: The date and time the Appointment was last updated
              type: string
              format: date-time
              example: '2026-03-25T10:30:00Z'
    TrackingEvent:
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          description: Unique identifier for the tracking event
          type: string
          format: uuid
          example: 0190a7c2-4b1f-7c3a-9f00-1c9b3a2d4e10
        type:
          type: string
          enum:
          - tracking_event
          example: tracking_event
        attributes:
          type: object
          required:
          - status
          - location
          - occurred_at
          - details
          properties:
            status:
              description: Carrier tracking status of the kit/sample, reflecting its
                movement through the delivery carrier's network. `kit_*` values are
                outbound events (the kit being delivered from Thriva to the customer);
                `sample_*` values are inbound events (the sample being returned from
                the customer to the lab).
              type: string
              enum:
              - kit_in_transit
              - kit_delivered
              - kit_delivery_attempted
              - kit_exception
              - sample_in_transit
              - sample_delivery_attempted
              - sample_delivered_to_lab
              - sample_exception
              example: kit_in_transit
            location:
              description: Location reported by the carrier, when available
              type: string
              nullable: true
              example: MOUNT PLEASANT MC
            occurred_at:
              description: The date and time, in ISO 8601 format (UTC), at which the
                event occurred
              type: string
              format: date-time
              example: '2026-03-29T09:15:00Z'
            details:
              description: Human-readable description of the status, suitable for
                display
              type: string
              example: Your kit is on its way.
    BadRequestError:
      type: object
      required:
      - title
      - detail
      - source
      properties:
        title:
          type: string
          description: Title of the error
          example: invalid field
        detail:
          type: string
          example: field_name.example must be a string
        source:
          type: object
          required:
          - pointer
          properties:
            pointer:
              description: A RFC6901 compliant JSON pointer to the attribute that
                caused the error
              type: string
              example: /data/field_name/example
    NotFoundError:
      type: object
      required:
      - title
      - detail
      properties:
        title:
          type: string
          description: Title of the error
          example: resource not found
    ForbiddenError:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          description: Title of the error
          example: action not permitted
    InvalidAccessTokenError:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          description: Title of the error
          example: invalid access token
    UnsupportedMediaTypeError:
      type: object
      required:
      - title
      - detail
      properties:
        title:
          type: string
          description: Title of the error
          example: unsupported media type
        detail:
          type: string
