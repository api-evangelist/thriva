    ContactDetail:
      description: Contact details for a User/Subject
      type: object
      required:
      - first_name
      - last_name
      properties:
        first_name:
          description: The first name
          type: string
          example: Frasier
        last_name:
          description: The last name
          type: string
          example: Crane
        email:
          description: The email address
          type: string
          example: frasier.crane@example.com
        mobile_phone_number:
