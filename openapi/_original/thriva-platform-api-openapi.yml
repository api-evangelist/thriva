  /v1/appointments:
    post:
      summary: Create an Appointment
      description: Creates an Appointment for a sample collection visit. You must
        provide either an `order_id` or a `user_id`, but not both. When using `user_id`,
        you must also provide an address (either `address_id` or inline `address`).
        A `remote` provider type means a practitioner visits the patient at their
        home or office (i.e. not at a clinic). The collection methods supported depend
        on the provider — for example, `remote-appt-a` currently supports venous collection
        only.
      tags:
      - Appointments API
      requestBody:
        $ref: '#/components/requestBodies/AppointmentCreate'
      responses:
        '201':
          $ref: '#/components/responses/AppointmentResponse'
        '400':
          description: Bad request
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: unsupported provider
                        detail:
                          type: string
                          example: 'Provider ''acme'' is not supported. Supported
                            providers: remote-appt-a'
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                              example: /data/attributes/provider_type
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
        '422':
          description: Unprocessable entity
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: collection method not supported
                        detail:
                          type: string
                          example: The provider does not currently support this collection
                            method for appointments
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                              example: /data/attributes/order_id
    get:
      summary: Fetch Appointments
      description: Lists all of your appointments, sorted by most recently created
      tags:
