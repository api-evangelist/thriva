              example: '2021-06-11T06:00:00Z'
        relationships:
          type: object
          required:
          - address
          - contact_detail
          properties:
            address:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: AD-25A37617-913C-4F39-B2D4-ED5B734DEC04
                    type:
                      type: string
                      example: address
            contact_detail:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: CD-25A37617-913C-4F39-B2D4-ED5B734DEC04
                    type:
                      type: string
                      example: contact_detail
    DeliveryAddress:
      type: object
      required:
      - name
      - line1
      - city
      - postcode
      - country
      properties:
        name:
          description: The name of the recipient at the delivery address
          type: string
          example: Mr Joe Blogs
        company_name:
          description: The name of the company
          type: string
          example: Thriva Ltd
        line1:
          description: The first line of the delivery address
          type: string
          example: 3rd Floor
        line2:
          description: The second line of the delivery address
          type: string
          example: White Collar Factory
        line3:
          description: The third line of the delivery address
          type: string
          example: 1 Old Street Yard
        city:
          description: The city for the delivery address
          type: string
          example: London
        state:
          description: The county or state for the delivery address
          type: string
          example: Greater London
        postcode:
          description: The postcode for the delivery address
          type: string
          example: EC1Y 8AF
        country:
          description: The country for the delivery address (ISO 3166-1 alpha-2)
          type: string
          example: GB
    Sample:
      type: object
      required:
      - type
      - collection_method
      properties:
        type:
          description: Whether you want the test to be a saliva or blood test
          type: string
          enum:
          - blood
          - saliva
          example: blood
        collection_method:
          description: Define what type of collection method you would like for the
            sample type
          type: string
          enum:
          - finger_prick
          - swab
          - venous
          - automatic_capillary
          example: finger_prick
    Analysis:
      description: Requirements for processing a sample
      type: object
      required:
      - required
      properties:
        required:
          description: Indicates whether a Thriva lab needs to perform analysis on
            this sample.
          type: boolean
          example: true
        lab:
          description: The identifier for the lab that should perform analysis on
            this sample. If one is not provided, one will be assigned based on the
            analysis requirements.
          type: string
          example: PUR1
    Kits:
      description: The requirements for the kits that should be part of this Order
      type: array
      items:
        description: A Kit object that relates to a physical test kits that will be
          sent to the delivery address
        type: object
        required:
        - count
        - analysis
        properties:
          test_profiles:
            description: A list of what needs to be tested for the user's sample
            type: array
            items:
              type: string
            example:
            - LFT
            - LIPP
          count:
            description: The number of test kits required
            type: integer
            enum:
            - 25
            - 50
            example: 25
          sample:
            $ref: '#/components/schemas/Sample'
          analysis:
            $ref: '#/components/schemas/Analysis'
