    AppointmentCreate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - type
                - attributes
                properties:
                  type:
                    type: string
                    example: appointment
                  attributes:
                    type: object
                    required:
                    - provider_type
                    properties:
                      provider_type:
                        description: The appointment provider to use. A `remote` provider
                          means a practitioner visits the patient at their home or
                          office rather than at a clinic.
                        type: string
                        enum:
                        - remote-appt-a
                        example: remote-appt-a
                      order_id:
                        description: The reference of the Order to create an appointment
                          for. Mutually exclusive with `user_id` — you must provide
                          one or the other.
                        type: string
                        example: O-A7A2A7C5-1C49-4B76-B560-6CBA5C28368E
                      user_id:
                        description: The ID of an existing User to create an appointment
                          for. Mutually exclusive with `order_id` — you must provide
                          one or the other. When using `user_id`, you must also provide
                          either `address_id` or `address`.
                        type: string
                        example: U-8719EAF0-6B39-46B5-86DA-AF11155F3B65
                      address_id:
                        description: A reference to an existing address. Cannot be
                          used together with `address`.
                        type: string
                        example: AD-12345678-1234-1234-1234-123456789012
                      address:
                        description: An inline address for the appointment. Cannot
                          be used together with `address_id`.
