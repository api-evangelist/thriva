                    type:
                      type: string
                      example: result_set_attachment
    BiomarkerResult:
      type: object
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          description: Unique identifier for Biomarker Result
          type: string
          example: BR-7CLGY37N8WLBE0E8AAULAPBCBMF9ATVZFJ70
        type:
          type: string
          example: biomarker_result
        attributes:
          type: object
          properties:
            code:
              description: Biomarker code for this Biomarker Result
              type: string
              example: ALP
            successful:
              type: boolean
              example: true
            failure_reason:
              type: string
              nullable: true
              enum:
              - clotted
              - contaminated
              - delay
              - foreign_object
              - haemolysed
              - icteric
              - insufficient
              - lab_error
              - lid_swap
              - lipaemic
              - mismatch
              - no_sample_received
              - sample_leaked
              - unknown
              - unlabelled
            failure_reason_description:
              type: string
              nullable: true
              description: Human-readable description of the failure reason
            abnormal_flag:
              type: string
              nullable: true
              example: A
            escalation_level:
              description: The escalation level for this biomarker result
              type: string
              enum:
              - very_high
              - high
              - medium
              - low
              - very_low
              - not_escalated
            result_type:
              type: string
              enum:
              - numeric
              - string
            result_value:
              type: string
              example: '1.78'
            result_unit:
              type: string
              example: umol/L
            result_operator:
              type: string
              nullable: true
              enum:
              - LESS_THAN
              - LESS_THAN_OR_EQUAL
              - GREATER_THAN
              - GREATER_THAN_OR_EQUAL
            notes:
              description: An array of notes returned from the Lab about this biomarker
                result
              type: array
              items:
                type: string
                example: Your Creatinine levels are high. Please discuss this with
                  your GP.
            reference_ranges:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Normal
                  lower_bound:
                    type: string
                    nullable: true
                    example: '50.0000'
                  upper_bound:
                    type: string
                    nullable: true
                    example: '250.0000'
                  operator:
                    type: string
                    nullable: true
                    example: LESS_THAN
                    enum:
                    - LESS_THAN
                    - LESS_THAN_OR_EQUAL
                    - GREATER_THAN
                    - GREATER_THAN_OR_EQUAL
                  severity_level:
                    type: integer
                    nullable: false
                    minimum: 10
                    maximum: 50
                    example: 20
            interpretation:
              description: Provides interpretation for results. String results will
                contain a display value and sentiment for the result. Numeric results
                will contain a display value and matched reference range
              type: object
              nullable: true
              properties:
                display_value:
                  description: For numeric results the display_value joins the operator
                    and numeric value together. For string results, the display_value
                    formats the string correctly and can provide a more human understandable
                    interpretation of the result. e.g. For an antibody test, the string_result
                    might be `positive` while the `display_value` would be `immune`.
                  type: string
                  example: '100.0'
                  nullable: true
                sentiment:
                  description: The sentiment associated with string result interpretations.
                    Can be used to decide how to display results on the frontend (i.e.
                    positive sentiment might be highlighted in green). Can be positive,
                    negative, or neutral
                  type: string
                  example: positive
                  nullable: true
                  enum:
                  - positive
                  - negative
                  - neutral
                matched_reference_range:
                  description: The reference range that the result value falls within
                  type: object
                  nullable: true
                  properties:
                    name:
                      type: string
                      example: Normal
                    severity_level:
                      type: integer
                      example: 20
        relationships:
          type: object
          properties:
            test_profiles:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: Test Profile ID
                        type: string
                        example: AB12
                      type:
                        type: string
                        example: test_profile
    Escalation:
