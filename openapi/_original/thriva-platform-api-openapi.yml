        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
  /v1/tracking/{tracking_code}:
    get:
      summary: List Tracking Events for a tracking code
      description: Returns the tracking history for a tracking code, in ascending
        chronological order by `occurred_at`. Covers two journeys - outbound kit delivery
        and inbound sample return (see the `tracking_code` parameter and `status`
        for detail). Returns an empty collection if no events are available, including
        when the feature is not yet enabled for your organisation.
      tags:
      - Tracking API
      parameters:
      - name: tracking_code
        in: path
        required: true
        schema:
          type: string
          description: The tracking code to look up. For the outbound (kit delivery)
            journey, this is the outbound_tracking_code from an Order; for the inbound
            (sample return) journey, it is the inbound_tracking_code from a Test.
          example: AA123456789US
      responses:
        '200':
          $ref: '#/components/responses/TrackingEventsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
components:
  parameters:
    PageNumber:
      in: query
      name: page[number]
      schema:
        type: integer
      description: The page that will be returned
      required: false
    PageSize:
      in: query
      name: page[size]
      description: The amount of items per page
      required: false
      schema:
        type: integer
        minimum: 10
        maximum: 100
    ResultSetIncludes:
      name: include
      description: A comma separated list of relationship objects to include in response
      in: query
      schema:
        type: string
        example: test_profiles,biomarker_results,escalations
    TestProfileIncludes:
      name: include
      description: A comma separated list of relationship objects to include in response
      in: query
      schema:
        type: string
        example: biomarkers
    UserIncludes:
      name: include
      description: A comma separated list of relationship objects to include in response
      in: query
      schema:
        type: string
        example: address,contact_detail
  requestBodies:
    OAuthTokenCreate:
      content:
        application/json:
          schema:
            required:
            - grant_type
            - client_id
            - client_secret
            - audience
            properties:
              grant_type:
                description: The type of OAuth Grant
                type: string
                example: client_credentials
              client_id:
                description: The client id provided to you by Thriva
                type: string
                example: Q3TaSO2SBRJq3ZzGJ7cwGbwIw889SIjo
              client_secret:
                description: The client secret provided to you by Thriva
                type: string
                example: iOZAHcJH8xf-rB7-AsB6XwEg2_1JO4MCXsa14ZuFmnkBr72c_zTG2BwOCYTun5Ps
              audience:
                description: API URL
                type: string
                example: https://api.euw2.thriva.io
    OrderCreate:
      content:
        application/vnd.api+json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - attributes
                properties:
                  type:
                    type: string
                    example: order
                  attributes:
                    type: object
                    required:
                    - delivery_address
                    - tests
                    properties:
                      delivery_address:
                        $ref: '#/components/schemas/DeliveryAddress'
                      tests:
                        description: An array of the Tests that should be part of
                          this Order
                        type: array
                        items:
                          description: A Test object that relates to a physical test
                            kit that will be sent to the delivery address
                          type: object
                          properties:
                            test_profiles:
                              description: A list of what needs to be tested for the
                                user's sample
                              type: array
                              items:
                                type: string
                              example:
                              - LFT
                              - LIPP
                            subject:
                              description: Details about the user for which a sample
                                is being collected
                              type: object
                              properties:
                                contact:
                                  description: Contact details for a subject.
                                  type: object
                                  required:
                                  - first_name
                                  - last_name
                                  properties:
                                    first_name:
                                      description: The subject's first name.
                                      type: string
                                      example: Frasier
                                    last_name:
                                      description: The subject's last name.
                                      type: string
                                      example: Crane
                                    email:
                                      description: The subject's email address.
                                      type: string
                                      example: frasier.crane@example.com
                                    mobile_phone_number:
                                      description: The subject's mobile phone number.
                                        Only GB numbers in the format +447123456789
                                      type: string
                                      example: '+447123456789'
                                date_of_birth:
                                  description: The date the subject was born, in ISO8601
                                    format.
                                  type: string
                                  example: '1953-03-07'
                                sex:
                                  description: The sex of the subject
                                  type: string
                                  enum:
                                  - female
                                  - male
                                  example: female
                            user_id:
                              description: An existing user's reference - for each
                                test you either need to pass in a subject object or
                                a user ID, not both
                              type: string
                              example: U-8719EAF0-6B39-46B5-86DA-AF11155F3B65
                            product_code:
                              description: The identifier for the Product being ordered.
                                Products are optionally made available to API partners
                                and may not be provided alongside test_profiles /
                                sample
                              type: string
                              example: P-12345
                            sample:
                              $ref: '#/components/schemas/Sample'
                            analysis:
                              $ref: '#/components/schemas/Analysis'
    ReorderCreate:
      content:
        application/vnd.api+json:
          schema:
            type: object
