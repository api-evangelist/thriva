        required: true
        schema:
          type: string
          description: The ID of an escalation
          example: ESC-A7A2A7C5-8FAB-4DE3-8836-513E53BAB194
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      example: escalation
                    attributes:
                      type: object
                      required:
                      - level
                      properties:
                        level:
                          description: The escalation level that you are acknowledging
                          type: string
                          example: critical
      responses:
        '202':
          $ref: '#/components/responses/EscalationResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          description: The request syntax was valid, but we were unable to process
